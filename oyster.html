<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜市蚵仔煎 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 熱鬧、手作感的夜市攤位，一個人顧攤的忙碌
   IDEA: 夜市小吃攤台——燈籠、招牌、攤車檯面、米色點餐板
   PICTURE: 中間整塊畫布就是攤台本身，食物在上面被做出來
   COLOUR and TYPE: 夜色深褐底、燈籠紅、每攤一個主色；招牌 Noto Serif TC 粗字，內文 Noto Sans TC
   LAYOUT: 直立：燈籠招牌與計時 → 排隊客人 → 攤台畫布 → 米色操作面板 */
:root{color-scheme:dark;--bg:#150d08;--ink:#fbefdc;--mut:#c4ad92;--red:#c8322b;--red2:#8f1d17;--jade:#7cb342;--cream:#f6ecd5;--cink:#3a2414;--card:#2a1c13}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans TC",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lan{height:22px;flex:none;background:radial-gradient(ellipse 8px 10px at 50% 60%,#ff6a4a,var(--red) 60%,transparent 64%) 0 0/40px 22px repeat-x;filter:drop-shadow(0 0 8px #ff4a2a99)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 14px 8px;flex:none}
h1{margin:0;font:900 22px/1.05 "Noto Serif TC",serif;background:var(--acc);color:var(--accink,#fff4e0);padding:5px 12px 7px;border-radius:6px;box-shadow:0 3px 0 var(--acc2),0 0 22px color-mix(in srgb,var(--acc) 45%,transparent);white-space:nowrap}
.hud{display:flex;gap:16px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hud span{display:block;font-size:13px;font-weight:500;color:var(--mut)}.hud b{font-size:22px;line-height:1.1}
#counter{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px;min-height:84px}
.cust{border:0;font:inherit;color:inherit;cursor:pointer;background:var(--card);border-radius:12px;padding:6px 6px 8px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 6px;align-items:center;text-align:left;box-shadow:0 2px 0 #000a;animation:in .35s ease-out;min-height:44px}
.cust>svg{width:30px;height:30px}
.cust .o{font-size:13px;line-height:1.3;display:flex;flex-wrap:wrap;gap:2px 3px;align-items:center}.cust .o b{font-size:17px;color:var(--acc3,var(--acc))}
.cust .o img{width:17px;height:17px}
.cust .pat{grid-column:1/-1;height:5px;border-radius:3px;background:#0007;overflow:hidden}.cust .pat i{display:block;height:100%}
.cust.ready{box-shadow:0 0 0 3px #7cd34a,0 0 16px #7cd34a88;background:#2f3a1c}
.cust.shake{animation:sh .35s}.cust:focus-visible{outline:3px solid var(--acc)}
.empty{grid-column:1/-1;color:var(--mut);font-size:13px;align-self:center;text-align:center}
#stage{position:relative;flex:1;min-height:220px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{flex:none;background:var(--cream);color:var(--cink);border-radius:18px 18px 0 0;padding:12px 14px 14px;box-shadow:0 -6px 20px #0009}
.sum{font-weight:900;font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px}
#sum{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sum small{font-weight:500;font-size:13px;color:#7a5a40;text-align:right}
.sum .bag{display:flex;flex-wrap:wrap;gap:2px;align-items:center}.sum .bag img{width:22px;height:22px}
.row{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px}
.btn{min-height:48px;border:0;border-radius:12px;font:700 16px "Noto Sans TC",sans-serif;cursor:pointer;background:#fff;color:var(--cink);box-shadow:0 3px 0 #d4c3a3;white-space:nowrap;padding:4px 6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d4c3a3}.btn:focus-visible{outline:3px solid var(--red)}
.btn.on{background:var(--jade);color:#fff;box-shadow:0 3px 0 #4f7a22}.btn.hot{background:var(--acc);color:var(--accink,#fff);box-shadow:0 3px 0 var(--acc2)}
.btn img{width:30px;height:30px;display:block;margin:0 auto 1px}.btn.fr{font-size:13px;padding:4px 2px;min-height:58px}
.toast{position:fixed;left:50%;top:42%;transform:translateX(-50%);font:900 26px "Noto Serif TC",serif;pointer-events:none;text-shadow:0 2px 0 #000,0 0 14px #000;animation:up 1.1s forwards;white-space:nowrap;z-index:5}
.ov{position:fixed;inset:0;background:#120b07d0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.card{max-width:380px;width:100%;background:var(--cream);color:var(--cink);border-radius:18px;padding:24px 22px;text-align:center;box-shadow:0 20px 50px #000}
.card h2{margin:0 0 4px;font:900 32px/1.1 "Noto Serif TC",serif;color:var(--acc2)}
.card ol{text-align:left;padding-left:1.3em;margin:12px 0 18px;color:#6a4a32}.card ol b{color:var(--cink)}
.goalline{margin-top:8px;font-weight:900;color:var(--red)}.stars{font-size:34px;letter-spacing:4px;color:#d9c9ad;line-height:1.2}.stars b{color:#e9a12e}
.big{font:900 48px/1 "Noto Serif TC",serif;color:var(--acc2);margin:8px 0;font-variant-numeric:tabular-nums}
.card .btn{background:var(--red);color:#fff;font-size:19px;width:100%;min-height:54px;box-shadow:0 4px 0 var(--red2)}
.home{display:inline-block;margin-top:14px;color:#8a5a36;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes in{from{transform:translateY(-12px);opacity:0}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.cust,.toast{animation:none}}
@media(max-width:380px){h1{font-size:19px;padding:5px 9px 6px}.hud{gap:10px}.hud b{font-size:19px}}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag3{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mut)}
.mt{position:relative;width:44px;height:7px;border-radius:4px;background:linear-gradient(90deg,#efe3c8 0 53%,#7cc243 53% 73%,#6e300e 73%);box-shadow:0 0 0 2px rgba(0,0,0,.55)}.mt i{position:absolute;top:-3px;width:3px;height:13px;margin-left:-1.5px;background:#fff;left:var(--p,0)}
.two{display:grid;gap:4px;width:52px;padding:3px 4px;border-radius:6px;background:rgba(0,0,0,.35)}.two .mt{width:44px}.two.ok{box-shadow:0 0 0 2px #ffd56a,0 0 10px #ffd56a99}
.sign3{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--acc);color:var(--accink,#fff8ea);font:900 26px/1.1 'Noto Serif TC',serif;padding:8px 22px;border-radius:10px;text-align:center;box-shadow:0 6px 16px #0008,inset 0 0 0 2px #fff1d6;pointer-events:none;white-space:nowrap}.sign3 small{display:block;font:700 13px 'Noto Sans TC',sans-serif;opacity:.85;margin-top:3px}@media(max-height:780px){.sign3{display:none}}
#hint3{position:absolute;left:0;right:0;top:46%;text-align:center;font:900 18px 'Noto Sans TC',sans-serif;color:#ffecc8;text-shadow:0 2px 6px #000;pointer-events:none;animation:pulse 1.2s ease-in-out infinite alternate}#hint3[hidden]{display:none}@keyframes pulse{to{opacity:.5}}

/* premium polish */
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 48%,transparent 55%,rgba(10,4,2,.55));box-shadow:inset 0 14px 18px -10px rgba(0,0,0,.6)}
.cust{background:linear-gradient(160deg,#36261a,#22160e);box-shadow:0 2px 0 #000a,inset 0 1px 0 #ffffff14;border:1px solid #ffffff0d}
h1{outline:1.5px solid rgba(255,244,224,.45);outline-offset:-5px;letter-spacing:.02em}
.panel{background:linear-gradient(#fbf3e2,var(--cream));box-shadow:0 -8px 24px #000a,inset 0 1px 0 #fff}
.btn{background:linear-gradient(#fff,#f6eedd);box-shadow:0 3px 0 #d4c3a3,inset 0 1px 0 #fff}
.btn.hot{background:linear-gradient(color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));box-shadow:0 3px 0 var(--acc2),inset 0 1px 0 #ffffff55}
.btn.on{background:linear-gradient(#8fcf4e,var(--jade));box-shadow:0 3px 0 #4f7a22,inset 0 1px 0 #ffffff55}
.sign3{background:linear-gradient(color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));text-shadow:0 2px 0 rgba(0,0,0,.25)}
.toast{background:linear-gradient(90deg,transparent,rgba(20,8,4,.55) 20%,rgba(20,8,4,.55) 80%,transparent);padding:6px 34px}
.card{background:linear-gradient(#fdf6e8,var(--cream));box-shadow:0 20px 50px #000,0 0 0 1px #ffffff40 inset}

/* readable order rows */
#counter{grid-template-columns:1fr;gap:5px;min-height:46px}
.cust{grid-template-columns:34px minmax(0,1fr);padding:5px 8px 6px;gap:2px 8px;min-height:44px}
.cust>svg{width:34px;height:34px;grid-row:span 2}
.cust .o{font-size:14px;gap:4px 5px;line-height:1.2}
.cust .o .it{display:inline-flex;align-items:center;gap:3px;background:rgba(255,236,200,.13);border:1px solid rgba(255,236,200,.18);border-radius:7px;padding:2px 7px 2px 3px;font-weight:700;color:#fff3dc;white-space:nowrap}
.cust .o .it.no{background:none;border-style:dashed;color:#c4ad92;font-weight:500;padding-left:6px}
.cust .o .it img{width:22px;height:22px}.cust .o .it b{font-size:15px;color:var(--acc3,#ffd06a);margin-left:1px}
.cust .o .lbl{font-size:12px;color:#c4ad92}.cust .o .ar{font-style:normal;color:#c4ad92;font-weight:900}
.cust .pat{grid-column:2;height:4px}
.empty{padding:10px 0}

:root{ --acc:#c0482e;--acc2:#6e1e10;--acc3:#ffb45a }
.panel .row+.row{margin-top:8px}.row.ing{gap:6px}.row.ing .btn.fr{min-height:56px;font-size:13px;padding:3px 1px}.row.ing .btn img{width:28px;height:28px}.step{white-space:nowrap;text-align:center;font:900 12px 'Noto Sans TC',sans-serif;color:#3a2414;background:rgba(255,248,234,.9);border-radius:8px;padding:2px 7px;margin:0 auto 3px;width:max-content;box-shadow:0 2px 6px #0008}.step.sel{box-shadow:0 0 0 2px #ffd56a,0 2px 6px #0008}.step.hot{background:#ffd56a;animation:pulse .5s ease-in-out infinite alternate}.mt.ma,.mt.mb{width:76px;margin:0 auto}.mt.ma{background:linear-gradient(90deg,#efe3c8 0 32%,#7cc243 32% 68%,#e8a23a 68% 86%,#6e300e 86%)}.mt.mb{background:linear-gradient(90deg,#efe3c8 0 31%,#7cc243 31% 69%,#6e300e 69%)}#guide{position:absolute;left:10px;right:10px;top:8px;background:rgba(255,248,234,.94);color:#3a2414;border-radius:12px;padding:8px 12px;font:700 15px/1.4 'Noto Sans TC',sans-serif;text-align:center;box-shadow:0 4px 12px #0007;pointer-events:none}#guide[hidden]{display:none}.heat{position:absolute;right:8px;top:62px;background:#1b120cd9;border:1px solid #ffffff1a;border-radius:12px;padding:4px 6px;display:flex;align-items:center;gap:5px;font-size:12px;color:#c4ad92;z-index:2}.heat button{width:44px;height:36px;border:0;border-radius:10px;font:900 16px 'Noto Serif TC',serif;background:#f6ecd5;color:#3a2414;cursor:pointer;box-shadow:0 3px 0 #0008}.heat button.on{background:linear-gradient(#ffcf7a,#e9932f);color:#4a1c05;box-shadow:0 3px 0 #8a4a10,0 0 12px #ffae4a99}#upg .card>b{display:block;font:900 22px 'Noto Serif TC',serif;color:var(--acc2);margin-bottom:12px}#upg .ul{display:grid;gap:10px}.ub{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(#fff,#f6eedd);box-shadow:0 3px 0 #d4c3a3;cursor:pointer;font:inherit;color:#3a2414}.ub b{display:block;font-size:17px;color:var(--acc)}.ub span{font-size:14px;color:#6a4a32}.ub:active{transform:translateY(2px)}
</style></head><body>
<div id="app">
  <div class="lan" aria-hidden="true"></div>
  <header><h1>老店蚵仔煎</h1>
    <div class="hud"><div><span id="dayl">第 1 天</span><b id="time">0</b></div><div><span id="goal">目標</span><b id="money">$0</b></div></div></header>
  <div id="counter" aria-label="排隊客人"><div class="empty">等客人上門…</div></div>
  <div id="stage"><canvas id="cv" aria-label="蚵仔煎鐵板"></canvas><div id="tags"></div><div id="guide" hidden></div><div class="heat" role="group" aria-label="火力">火力<button data-h="2">大</button><button data-h="1" class="on">中</button><button data-h="0">小</button></div><div id="upg" class="ov" hidden><div class="card"><b></b><div class="ul"></div></div></div></div>
  <div class="panel">
    <div class="sum"><span id="sum"></span><small>淋好醬就點客人</small></div>
    <div class="row ing" style="--cols:4"><button class="btn fr" data-a="oyster"><img alt="">蚵仔</button><button class="btn fr" data-a="shrimp"><img alt="">蝦仁</button><button class="btn fr" data-a="egg"><img alt="">打蛋</button><button class="btn fr" data-a="greens"><img alt="">青菜</button></div><div class="row" style="--cols:4"><button class="btn hot" id="flip">翻面</button><button class="btn hot" id="up">起鍋</button><button class="btn" id="wipe">擦掉醬</button><button class="btn" id="dumpo">倒掉</button></div>
  </div>
</div>
<div class="ov" id="start"><div class="card">
  <h2>煎蚵仔煎</h2><div>油壺下油、杓子淋粉漿、擠醬瓶畫醬，大火鐵板現煎</div><div class="goalline" id="sgoal"></div>
  <ol><li><b>點一下</b>油壺、食材碗、粉漿桶、鍋鏟、醬料瓶就會自動做那一步，會自動找到該做的那份；想自己來也可以<b>按住拖</b></li><li>順序：<b>下油 → 蚵仔／蝦仁</b>（煎香一下）<b>→ 粉漿 → 打蛋 → 青菜</b></li><li>出現「翻面！」就翻，另一面熟了按<b>起鍋</b>；右邊<b>火力</b>大火煎得快、但容易焦</li><li>照客人要的淋<b>甜辣醬、辣醬</b>，<b>點客人</b>出餐</li><li>從第 2 天起，開攤前可以挑一個<b>升級</b></li></ol>
  <button class="btn" id="go">開攤！</button>
  <div><a class="home" href="index.html">← 回夜市小吃街</a></div>
</div></div>
<div class="ov" id="end" hidden><div class="card">
  <h2 id="etitle">收攤了</h2><div class="stars" id="stars"></div><div>今晚營收</div><div class="big" id="final">$0</div>
  <div id="stats" style="color:#6a4a32"></div><p id="best" style="margin:6px 0 18px;font-weight:700"></p>
  <button class="btn" id="again">再擺一攤</button>
  <div><a class="home" href="index.html">← 回夜市小吃街</a></div>
</div></div>
<script>
{
/* ---------- shared night-market stall engine ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const stageOf=p=>p<.8?'raw':p<=1.1?'good':p<1.4?'over':'char';
function lerpCol(stops,p){for(let i=1;i<stops.length;i++)if(p<=stops[i][0]){const t=(p-stops[i-1][0])/(stops[i][0]-stops[i-1][0]),a=stops[i-1][1],b=stops[i][1];return `rgb(${[0,1,2].map(j=>Math.round(a[j]+(b[j]-a[j])*t)).join(',')})`}const l=stops[stops.length-1][1];return `rgb(${l.join(',')})`}
let ac=null;
function beep(f,d,type='sine',v=.15){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function noise(len=.6,vol=.2,freq=2500,type='highpass'){if(!ac)return;try{const n=ac.sampleRate*len|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)*(Math.random()<.3?1:.3);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type=type;f.frequency.value=freq;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start()}catch(e){}}
let loopG=null;
function startLoop(){if(!ac||loopG)return;try{const n=ac.sampleRate*2|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(Math.random()<.12?1:.22);const s=ac.createBufferSource(),f=ac.createBiquadFilter();s.buffer=b;s.loop=true;f.type='bandpass';f.frequency.value=4200;f.Q.value=.6;loopG=ac.createGain();loopG.gain.value=0;s.connect(f).connect(loopG).connect(ac.destination);s.start()}catch(e){loopG=null}}
function loopVol(v){if(loopG)loopG.gain.setTargetAtTime(v,ac.currentTime,.15)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(msg,col='#fff'){const d=document.createElement('div');d.className='toast';d.textContent=msg;d.style.color=col;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
/* small icons drawn once on a canvas and reused as <img> */
const ICON={};
function icon(key,draw,size=48){if(!ICON[key]){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');draw(g,size);ICON[key]=c.toDataURL()}return ICON[key]}
/* canvas */
const cv=$('#cv');let cx=null,W=300,H=300,G=null;
function fit(){const r=cv.parentElement.getBoundingClientRect();if(!r.width||!r.height)return;const d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);if(cx)cx.setTransform(d,0,0,d,0,0);G&&G.layout&&G.layout(W,H)}
const fitObs=new ResizeObserver(fit);fitObs.observe(cv.parentElement);
/* particles shared by all games */
const PT=[];
function puff(x,y,o){PT.push(Object.assign({x,y,vx:0,vy:-20,life:1,max:1,r:4,col:'255,255,255',a:.25,grow:10,g:0},o))}
function drawPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const t=1-p.life/p.max,r=p.r+p.grow*t;cx.fillStyle=`rgba(${p.col},${p.a*Math.sin(Math.PI*Math.min(1,t+.05))})`;cx.beginPath();cx.arc(p.x,p.y,Math.max(.5,r),0,7);cx.fill()}}
/* customers */
const SKIN=['#f2c9a0','#e0ac7e','#c68b5e','#f5d6b8'],HAIR=['#2b1d14','#5a3a22','#111','#8a8a8a','#b5462f'];
const face=c=>`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="${c.shirt}"/><circle cx="32" cy="34" r="19" fill="${c.skin}"/><path d="M13 32c0-13 9-19 19-19s19 6 19 19c-5-7-11-9-19-9s-14 2-19 9z" fill="${c.hair}"/><circle cx="25" cy="35" r="2.2" fill="#2a1a10"/><circle cx="39" cy="35" r="2.2" fill="#2a1a10"/><path class="m" d="M26 43q6 5 12 0" stroke="#2a1a10" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
let S,cid=0,DAY=1;
const ROUND=()=>G.round||90;
function reset(){S={t:0,money:0,served:0,perfect:0,lost:0,run:false,cust:[],next:1.5,streak:0,hit:false};PT.length=0;G.reset();renderCust();hud();updSum()}
function updSum(){$('#sum').innerHTML=G.sum();markReady()}

    S.cust.forEach(k=>{k.pat-=dt;const e=$(`.cust[data-c="${k.id}"]`);if(!e)return;const r=Math.max(0,k.pat/k.max),bar=e.querySelector('.pat i');

      if(busy(s)){const burn=(!s.flipped&&s.p>FLIP1+.25)||s.p2>DONE1+.3;
        if(Math.random()<dt*(burn?6:1.6))E3.puff([s.x+rnd(-.3,.3),TY+.25,SPZ+rnd(-.2,.2)],{vy:.6,r:.08,grow:.3,a:burn?.38:.07,col:burn?[.3,.3,.3]:[1,1,1],life:1.2,max:1.2});
        if(Math.random()<dt*(s.slurry&&!s.flipped?10:5))E3.puff([s.x+rnd(-.45,.45),TY+(s.slurry?.08:.02),SPZ+rnd(-.35,.35)],{vy:.04,r:.02,grow:.05,a:.75,col:s.slurry?[1,1,1]:[1,.94,.75],life:.35,max:.35})}
      const sp=E3.project([s.x,TY,SPZ+SR*1.05]),t=tags.get(ti++);t.style.display='block';t.style.transform=`translate(${sp[0]-(busy(s)||i===O.sel?40:16)}px,${sp[1]}px)`;
      const idle=!busy(s)&&i!==O.sel,step=idle?'':nextStep(s),hot=/！/.test(step),key=(s.flipped?'b':'a')+(s.slurry?'m':'')+step+idle;
      if(t.dataset.k!==key){t.dataset.k=key;t.innerHTML=`<div class="step ${hot?'hot':''}">${i+1}號${idle?'':'・'+step}</div>`+(s.slurry?`<div class="mt ${s.flipped?'mb':'ma'}"><i></i></div>`:'')}
      t.firstChild.classList.toggle('sel',i===O.sel);const m=t.querySelector('.mt');if(m)m.style.setProperty('--p',Math.min(100,(s.flipped?s.p2/1.6:s.p/1.4)*100)+'%')});
    tags.hideFrom(ti);
    if(O.anim){O.anim.t+=dt;if(O.anim.t>.75)O.anim=null}
    const A=O.anim,home=(g,h,kk)=>{for(let i=0;i<3;i++)g.pos[i]+=(h[i]-g.pos[i])*Math.min(1,dt*kk)};let T=O.tool,P=O.ptr;
    if(!T&&A){T=A.k;P=A.i!==undefined?[spots[A.i].x+Math.sin(A.t*9)*.12,TY+.05,SPZ+Math.cos(A.t*7)*.08]:[PLATE[0]-.45+A.t/.75*.9,PLY,PLATE[2]+Math.sin(A.t*30)*.15]}
    if(T==='oil'&&P){oilPot.pos=[P[0]+.5,TY+.55,P[2]];oilPot.rot=[0,0,.85];streamOil.vis=true;streamOil.pos=[P[0]+.02,TY,P[2]];streamOil.scl=[1,.62,1]}else{home(oilPot,OIL_HOME,10);oilPot.rot=[0,0,oilPot.rot[2]*.8];streamOil.vis=false}
    if(T==='slurry'&&P){ladle.pos=[P[0]+.15,TY+.7,P[2]];ladle.rot=[0,0,-1.1];streamSl.vis=true;streamSl.pos=[P[0]-.02,TY,P[2]];streamSl.scl=[1,.62,1];ladleFill.vis=false}else{home(ladle,LADLE_HOME,10);ladle.rot=[0,0,ladle.rot[2]*.8];streamSl.vis=false;ladleFill.vis=true}
    if(T==='sweet'&&P){sweetB.pos=[P[0],PLY+.8,P[2]];sweetB.rot=[0,0,Math.PI]}else{home(sweetB,SB_HOME,10);sweetB.rot=[0,0,sweetB.rot[2]*.75]}
    if(T==='hot'&&P){hotB.pos=[P[0],PLY+.8,P[2]];hotB.rot=[0,0,Math.PI]}else{home(hotB,HB_HOME,10);hotB.rot=[0,0,hotB.rot[2]*.75]}
    held.vis=!!(T&&T.startsWith('ing:')&&P);Object.entries(heldK).forEach(([k,g])=>g.vis=T==='ing:'+k);if(held.vis)held.pos=[P[0],TY+.45+Math.sin(el*8)*.03,P[2]];
    if(T==='spat'&&P&&!flipping){spat.vis=true;spat.pos=[P[0],TY+.25,P[2]+.1];spat.rot=[.25,0,0]}else if(flipping){spat.vis=true;spat.pos=[flipping.x,TY+.08+Math.sin(Math.PI*flipping.flipT)*.6,SPZ+.1];spat.rot=[flipping.flipT*Math.PI*.6,0,0]}else{spat.vis=true;spat.pos=SPAT_HOME.slice();spat.rot=[0,-Math.PI/2,0]}
    dish.vis=!!O.plate;
    flame.emi=[.55+.3*O.heat+.15*Math.sin(el*9),.25+.1*O.heat,.06];BULBS.forEach((b,j)=>b.emi=[1,.75+.05*Math.sin(el*2+j),.38]);
    if(S&&S.run&&DAY>1&&!O.chosen[DAY])showUpg();
    E3.stepParts(dt);E3.render(W,H);guide()},
  down(x,y){O.dn={x,y,t:performance.now()};const t=grab(x,y);if(t){if((t==='sweet'||t==='hot')&&!O.plate){toast('先起鍋再淋醬','#ffd56a');return}O.tool=t;O.warned=false;O.ptr=E3.unproject(x,y,planeOf(t));O.moved=0;return}
    const i=spotAt(x,y);if(i>=0&&i!==O.sel){O.sel=i;beep(520,.04)}},
  move(x,y){if(O.tool){O.ptr=E3.unproject(x,y,planeOf(O.tool));if(O.dn)O.moved=Math.max(O.moved||0,Math.hypot(x-O.dn.x,y-O.dn.y))}},
  up(){const T=O.tool,P=O.ptr;if(T&&(O.moved||0)<14&&O.dn&&performance.now()-O.dn.t<450){O.tool=null;O.ptr=null;tapTool(T);return}if(T==='sweet'||T==='hot')updSum();
    if(T&&P&&(T.startsWith('ing:')||T==='spat')){const i=spots.findIndex(s=>Math.hypot(P[0]-s.x,P[2]-SPZ)<SR*1.05);
      if(i>=0){O.sel=i;if(T==='spat')flip();else{const k=T.slice(4),before=JSON.stringify([spots[i].prot,spots[i].egg,spots[i].greens]);act(k);
        if(JSON.stringify([spots[i].prot,spots[i].egg,spots[i].greens])!==before)for(let j=0;j<(k==='egg'?8:6);j++)E3.puff([P[0],TY+.1,P[2]],k==='egg'?{vx:rnd(-.8,.8),vy:rnd(.6,1.4),vz:rnd(-.8,.8),g:6,r:.03,grow:0,a:.95,col:[.96,.92,.84],life:.5,max:.5}:{vx:rnd(-.9,.9),vy:rnd(1,2),vz:rnd(-.9,.9),g:6,r:.02,grow:0,a:.9,col:[1,.85,.45],life:.45,max:.45})}}
      else{if(T==='spat')flip();else act(T.slice(4))}}
    O.tool=null;O.ptr=null}
});
/* spatula (declared after boot is fine: only used inside draw) */
const SPAT_HOME=[.75,TY+.03,SPZ+1.08],spat=E3.group({vis:true,pos:SPAT_HOME.slice(),rot:[0,-Math.PI/2,0]});
E3.add(E3.mesh(GEO.rbox(.6,.02,.45,.01,2)),{parent:spat,col:C(0xc9ccce),sp:1.4,sh:90});
E3.add(E3.mesh(GEO.lathe([[0,0],[.03,0],[.03,1.1],[0,1.12]],8)),{parent:spat,pos:[0,0,.22],rot:[1.25,0,0],col:C(0x5a3a22),sp:.3});
let lastG='';
function guide(){const g=$('#guide');if(!g||!S)return;const s=spots[O.sel];let t='';
  if(S.run){if(O.plate&&!spots.some(busy))t='點醬料瓶淋醬（也可按住自己畫），再點客人出餐';else t=`${O.sel+1}號鐵板：${nextStep(s)}　（點工具或食材就會自動做）`}
  if(t!==lastG){lastG=t;g.textContent=t;g.hidden=!t}}
document.querySelectorAll('[data-a]').forEach(b=>{b.querySelector('img').src=iIcon(b.dataset.a);b.onclick=()=>act(b.dataset.a)});
$('#flip').onclick=flip;$('#up').onclick=serveUp;
$('#wipe').onclick=()=>{if(!O.drops.length)return;clearDrops();updSum();beep(300,.08)};
$('#dumpo').onclick=()=>{if(!O.plate)return;O.plate=null;clearDrops();updSum();beep(200,.15,'square',.05)};


function showUpg(){const left=UPG.filter(u=>!O.up[u.k]);O.chosen[DAY]=true;if(!left.length)return;S.run=false;
  const pick3=left.sort(()=>Math.random()-.5).slice(0,3),m=$('#upg');m.querySelector('b').textContent=`第 ${DAY} 天開攤前，挑一個升級`;
  m.querySelector('.ul').innerHTML=pick3.map(u=>`<button class="ub" data-u="${u.k}"><b>${u.n}</b><span>${u.d}</span></button>`).join('');m.hidden=false;
  m.querySelectorAll('.ub').forEach(b=>b.onclick=()=>{const k=b.dataset.u;O.up[k]=true;if(k==='patient')G.patience=Math.round(50*1.3);m.hidden=true;S.run=true;beep(988,.1,'triangle');setTimeout(()=>beep(1319,.15,'triangle'),90);toast('升級：'+UPG.find(u=>u.k===k).n,'#ffd56a')})}
function setHeat(h){O.heat=h;document.querySelectorAll('.heat button').forEach(b=>b.classList.toggle('on',+b.dataset.h===h))}
document.querySelectorAll('.heat button').forEach(b=>b.onclick=()=>{setHeat(+b.dataset.h);beep(300+ +b.dataset.h*200,.06);if(+b.dataset.h===2)noise(.4,.12,2500)});

}
