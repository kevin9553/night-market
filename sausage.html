<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜市烤香腸 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 熱鬧、手作感的夜市攤位，一個人顧攤的忙碌
   IDEA: 夜市小吃攤台——燈籠、招牌、攤車檯面、米色點餐板
   PICTURE: 中間整塊畫布就是攤台本身，食物在上面被做出來
   COLOUR and TYPE: 夜色深褐底、燈籠紅、每攤一個主色；招牌 Noto Serif TC 粗字，內文 Noto Sans TC
   LAYOUT: 直立：燈籠招牌與計時 → 排隊客人 → 攤台畫布 → 米色操作面板 */
:root{color-scheme:dark;--bg:#150d08;--ink:#fbefdc;--mut:#c4ad92;--red:#c8322b;--red2:#8f1d17;--jade:#7cb342;--cream:#f6ecd5;--cink:#3a2414;--card:#2a1c13}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans TC",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lan{height:22px;flex:none;background:radial-gradient(ellipse 8px 10px at 50% 60%,#ff6a4a,var(--red) 60%,transparent 64%) 0 0/40px 22px repeat-x;filter:drop-shadow(0 0 8px #ff4a2a99)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 14px 8px;flex:none}
h1{margin:0;font:900 22px/1.05 "Noto Serif TC",serif;background:var(--acc);color:var(--accink,#fff4e0);padding:5px 12px 7px;border-radius:6px;box-shadow:0 3px 0 var(--acc2),0 0 22px color-mix(in srgb,var(--acc) 45%,transparent);white-space:nowrap}
.hud{display:flex;gap:16px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hud span{display:block;font-size:13px;font-weight:500;color:var(--mut)}.hud b{font-size:22px;line-height:1.1}
#counter{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px;min-height:84px}
.cust{border:0;font:inherit;color:inherit;cursor:pointer;background:var(--card);border-radius:12px;padding:6px 6px 8px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 6px;align-items:center;text-align:left;box-shadow:0 2px 0 #000a;animation:in .35s ease-out;min-height:44px}
.cust>svg{width:30px;height:30px}
.cust .o{font-size:13px;line-height:1.3;display:flex;flex-wrap:wrap;gap:2px 3px;align-items:center}.cust .o b{font-size:17px;color:var(--acc3,var(--acc))}
.cust .o img{width:17px;height:17px}
.cust .pat{grid-column:1/-1;height:5px;border-radius:3px;background:#0007;overflow:hidden}.cust .pat i{display:block;height:100%}
.cust.ready{box-shadow:0 0 0 3px #7cd34a,0 0 16px #7cd34a88;background:#2f3a1c}
.cust.shake{animation:sh .35s}.cust:focus-visible{outline:3px solid var(--acc)}
.empty{grid-column:1/-1;color:var(--mut);font-size:13px;align-self:center;text-align:center}
#stage{position:relative;flex:1;min-height:220px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{flex:none;background:var(--cream);color:var(--cink);border-radius:18px 18px 0 0;padding:12px 14px 14px;box-shadow:0 -6px 20px #0009}
.sum{font-weight:900;font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px}
#sum{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sum small{font-weight:500;font-size:13px;color:#7a5a40;text-align:right}
.sum .bag{display:flex;flex-wrap:wrap;gap:2px;align-items:center}.sum .bag img{width:22px;height:22px}
.row{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px}
.btn{min-height:48px;border:0;border-radius:12px;font:700 16px "Noto Sans TC",sans-serif;cursor:pointer;background:#fff;color:var(--cink);box-shadow:0 3px 0 #d4c3a3;white-space:nowrap;padding:4px 6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d4c3a3}.btn:focus-visible{outline:3px solid var(--red)}
.btn.on{background:var(--jade);color:#fff;box-shadow:0 3px 0 #4f7a22}.btn.hot{background:var(--acc);color:var(--accink,#fff);box-shadow:0 3px 0 var(--acc2)}
.btn img{width:30px;height:30px;display:block;margin:0 auto 1px}.btn.fr{font-size:13px;padding:4px 2px;min-height:58px}
.toast{position:fixed;left:50%;top:42%;transform:translateX(-50%);font:900 26px "Noto Serif TC",serif;pointer-events:none;text-shadow:0 2px 0 #000,0 0 14px #000;animation:up 1.1s forwards;white-space:nowrap;z-index:5}
.ov{position:fixed;inset:0;background:#120b07d0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.card{max-width:380px;width:100%;background:var(--cream);color:var(--cink);border-radius:18px;padding:24px 22px;text-align:center;box-shadow:0 20px 50px #000}
.card h2{margin:0 0 4px;font:900 32px/1.1 "Noto Serif TC",serif;color:var(--acc2)}
.card ol{text-align:left;padding-left:1.3em;margin:12px 0 18px;color:#6a4a32}.card ol b{color:var(--cink)}
.goalline{margin-top:8px;font-weight:900;color:var(--red)}.stars{font-size:34px;letter-spacing:4px;color:#d9c9ad;line-height:1.2}.stars b{color:#e9a12e}
.big{font:900 48px/1 "Noto Serif TC",serif;color:var(--acc2);margin:8px 0;font-variant-numeric:tabular-nums}
.card .btn{background:var(--red);color:#fff;font-size:19px;width:100%;min-height:54px;box-shadow:0 4px 0 var(--red2)}
.home{display:inline-block;margin-top:14px;color:#8a5a36;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes in{from{transform:translateY(-12px);opacity:0}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.cust,.toast{animation:none}}
@media(max-width:380px){h1{font-size:19px;padding:5px 9px 6px}.hud{gap:10px}.hud b{font-size:19px}}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag3{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mut)}
.mt{position:relative;width:44px;height:7px;border-radius:4px;background:linear-gradient(90deg,#efe3c8 0 53%,#7cc243 53% 73%,#6e300e 73%);box-shadow:0 0 0 2px rgba(0,0,0,.55)}.mt i{position:absolute;top:-3px;width:3px;height:13px;margin-left:-1.5px;background:#fff;left:var(--p,0)}
.two{display:grid;gap:4px;width:52px;padding:3px 4px;border-radius:6px;background:rgba(0,0,0,.35)}.two .mt{width:44px}.two.ok{box-shadow:0 0 0 2px #ffd56a,0 0 10px #ffd56a99}
.sign3{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--acc);color:var(--accink,#fff8ea);font:900 26px/1.1 'Noto Serif TC',serif;padding:8px 22px;border-radius:10px;text-align:center;box-shadow:0 6px 16px #0008,inset 0 0 0 2px #fff1d6;pointer-events:none;white-space:nowrap}.sign3 small{display:block;font:700 13px 'Noto Sans TC',sans-serif;opacity:.85;margin-top:3px}@media(max-height:640px){.sign3{display:none}}
#hint3{position:absolute;left:0;right:0;top:46%;text-align:center;font:900 18px 'Noto Sans TC',sans-serif;color:#ffecc8;text-shadow:0 2px 6px #000;pointer-events:none;animation:pulse 1.2s ease-in-out infinite alternate}#hint3[hidden]{display:none}@keyframes pulse{to{opacity:.5}}

:root{ --acc:#b8361e;--acc2:#6e1a0c;--acc3:#ff9a6a }
.row+.row{margin-top:8px}
</style></head><body>
<div id="app">
  <div class="lan" aria-hidden="true"></div>
  <header><h1>炭烤大香腸</h1>
    <div class="hud"><div><span id="dayl">第 1 天</span><b id="time">0</b></div><div><span id="goal">目標</span><b id="money">$0</b></div></div></header>
  <div id="counter" aria-label="排隊客人"><div class="empty">等客人上門…</div></div>
  <div id="stage"><canvas id="cv" aria-label="炭火烤香腸架"></canvas><div id="tags"></div><div class="sign3">炭烤香腸<small>原味・黑胡椒・辣味　配生蒜</small></div><div id="hint3" hidden>按「放香腸」放上烤架</div></div>
  <div class="panel">
    <div class="sum"><span id="sum"></span><small>根數、口味、蒜頭對了就點客人</small></div>
    <div class="row" style="--cols:2"><button class="btn hot" id="addss">放香腸</button><button class="btn" id="dumpss">倒掉重來</button></div><div class="row" style="--cols:2"><button class="btn" id="flv">口味：原味</button><button class="btn" id="garlic">蒜頭：不加</button></div>
  </div>
</div>
<div class="ov" id="start"><div class="card">
  <h2>烤香腸</h2><div>炭火慢烤、翻面要勤，油亮焦香才好吃</div><div class="goalline" id="sgoal"></div>
  <ol><li>按<b>放香腸</b>放上烤架，一次最多 6 根</li><li>只有朝下那面會烤熟，<b>點香腸翻面</b>，兩條火候條都要到<b>綠區</b></li><li>兩面都烤好時香腸會發亮，<b>再點一次</b>夾到盤子上</li><li>照客人要的<b>根數、口味、蒜頭</b>配好，<b>點客人</b>出餐</li></ol>
  <button class="btn" id="go">開攤！</button>
  <div><a class="home" href="index.html">← 回夜市小吃街</a></div>
</div></div>
<div class="ov" id="end" hidden><div class="card">
  <h2 id="etitle">收攤了</h2><div class="stars" id="stars"></div><div>今晚營收</div><div class="big" id="final">$0</div>
  <div id="stats" style="color:#6a4a32"></div><p id="best" style="margin:6px 0 18px;font-weight:700"></p>
  <button class="btn" id="again">再擺一攤</button>
  <div><a class="home" href="index.html">← 回夜市小吃街</a></div>
</div></div>
<script>
{
/* ---------- shared night-market stall engine ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const stageOf=p=>p<.8?'raw':p<=1.1?'good':p<1.4?'over':'char';
function lerpCol(stops,p){for(let i=1;i<stops.length;i++)if(p<=stops[i][0]){const t=(p-stops[i-1][0])/(stops[i][0]-stops[i-1][0]),a=stops[i-1][1],b=stops[i][1];return `rgb(${[0,1,2].map(j=>Math.round(a[j]+(b[j]-a[j])*t)).join(',')})`}const l=stops[stops.length-1][1];return `rgb(${l.join(',')})`}
let ac=null;
function beep(f,d,type='sine',v=.15){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function noise(len=.6,vol=.2,freq=2500,type='highpass'){if(!ac)return;try{const n=ac.sampleRate*len|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)*(Math.random()<.3?1:.3);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type=type;f.frequency.value=freq;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start()}catch(e){}}
let loopG=null;
function startLoop(){if(!ac||loopG)return;try{const n=ac.sampleRate*2|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(Math.random()<.12?1:.22);const s=ac.createBufferSource(),f=ac.createBiquadFilter();s.buffer=b;s.loop=true;f.type='bandpass';f.frequency.value=4200;f.Q.value=.6;loopG=ac.createGain();loopG.gain.value=0;s.connect(f).connect(loopG).connect(ac.destination);s.start()}catch(e){loopG=null}}
function loopVol(v){if(loopG)loopG.gain.setTargetAtTime(v,ac.currentTime,.15)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(msg,col='#fff'){const d=document.createElement('div');d.className='toast';d.textContent=msg;d.style.color=col;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
/* small icons drawn once on a canvas and reused as <img> */
const ICON={};
function icon(key,draw,size=48){if(!ICON[key]){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');draw(g,size);ICON[key]=c.toDataURL()}return ICON[key]}
/* canvas */
const cv=$('#cv');let cx=null,W=300,H=300,G=null;
function fit(){const r=cv.parentElement.getBoundingClientRect();if(!r.width||!r.height)return;const d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);if(cx)cx.setTransform(d,0,0,d,0,0);G&&G.layout&&G.layout(W,H)}
const fitObs=new ResizeObserver(fit);fitObs.observe(cv.parentElement);
/* particles shared by all games */
const PT=[];
function puff(x,y,o){PT.push(Object.assign({x,y,vx:0,vy:-20,life:1,max:1,r:4,col:'255,255,255',a:.25,grow:10,g:0},o))}
function drawPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const t=1-p.life/p.max,r=p.r+p.grow*t;cx.fillStyle=`rgba(${p.col},${p.a*Math.sin(Math.PI*Math.min(1,t+.05))})`;cx.beginPath();cx.arc(p.x,p.y,Math.max(.5,r),0,7);cx.fill()}}
/* customers */
const SKIN=['#f2c9a0','#e0ac7e','#c68b5e','#f5d6b8'],HAIR=['#2b1d14','#5a3a22','#111','#8a8a8a','#b5462f'];
const face=c=>`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="${c.shirt}"/><circle cx="32" cy="34" r="19" fill="${c.skin}"/><path d="M13 32c0-13 9-19 19-19s19 6 19 19c-5-7-11-9-19-9s-14 2-19 9z" fill="${c.hair}"/><circle cx="25" cy="35" r="2.2" fill="#2a1a10"/><circle cx="39" cy="35" r="2.2" fill="#2a1a10"/><path class="m" d="M26 43q6 5 12 0" stroke="#2a1a10" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
let S,cid=0,DAY=1;
const ROUND=()=>G.round||90;
function reset(){S={t:0,money:0,served:0,perfect:0,lost:0,run:false,cust:[],next:1.5,streak:0,hit:false};PT.length=0;G.reset();renderCust();hud();updSum()}
function updSum(){$('#sum').innerHTML=G.sum();markReady()}
function spawn(){const o=G.order(DAY,S.t);o.id=++cid;o.max=o.pat=Math.max(15,(G.patience||36)-S.t/7-(DAY-1)*3);o.skin=SKIN[cid%4];o.hair=pick(HAIR);o.shirt=`hsl(${rnd(0,360)|0},40%,38%)`;S.cust.push(o);renderCust();beep(1200,.08)}
function renderCust(){const c=$('#counter');
  c.innerHTML=S.cust.length?S.cust.map(k=>`<button class="cust" data-c="${k.id}" aria-label="${G.orderText(k)}">${face(k)}<div class="o">${G.orderHTML(k)}</div><div class="pat"><i></i></div></button>`).join(''):'<div class="empty">等客人上門…</div>';
  c.querySelectorAll('.cust').forEach(b=>b.onclick=()=>serve(+b.dataset.c));markReady()}
function markReady(){document.querySelectorAll('.cust').forEach(b=>{const k=S.cust.find(x=>x.id===+b.dataset.c);b.classList.toggle('ready',!!k&&G.matches(k))})}
function serve(id){
  if(!S.run)return;const k=S.cust.find(x=>x.id===id),el=$(`.cust[data-c="${id}"]`);if(!k)return;
  const r=G.check(k);
  if(r.err){toast(r.err,'#ff8a7a');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');beep(180,.2,'sawtooth',.06);return}
  let pay=r.pay;
  if(r.perfect){S.streak++;pay+=Math.round(k.pat/k.max*15)+(S.streak-1)*5;S.perfect++}else S.streak=0;
  S.money+=pay;S.served++;
  toast(r.perfect?`+$${pay} 讚啦！${S.streak>1?' 連續'+S.streak:''}`:`+$${pay} ${r.msg||''}`,r.perfect?'#ffd56a':'#ffb08a');
  if(r.perfect){beep(988,.1,'triangle');setTimeout(()=>beep(1319,.18,'triangle'),90);buzz(20)}else beep(400,.15,'triangle');
  S.cust=S.cust.filter(x=>x!==k);G.clear(true);renderCust();hud();updSum();
}
function goal(d){return G.goal(d)}
function hud(){$('#time').textContent=Math.max(0,Math.ceil(ROUND()-S.t));$('#money').textContent='$'+S.money;
  if(S.run&&!S.hit&&S.money>=goal(DAY)){S.hit=true;setTimeout(()=>toast('達成今日目標！','#7cd34a'),600)}}
function dayUI(){$('#dayl').textContent=`第 ${DAY} 天`;$('#goal').textContent=`目標 $${goal(DAY)}`;$('#sgoal').textContent=`第 ${DAY} 天 · 營收目標 $${goal(DAY)}`}
let last=0;
function loop(ts){requestAnimationFrame(loop);try{
  const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  if(S.run){S.t+=dt;let gone=false;
    S.cust.forEach(k=>{k.pat-=dt;const e=$(`.cust[data-c="${k.id}"]`);if(!e)return;const r=Math.max(0,k.pat/k.max),bar=e.querySelector('.pat i');
      bar.style.width=r*100+'%';bar.style.background=r>.5?'#7cb342':r>.25?'#e8a23a':'#d63a2f';e.querySelector('.m').setAttribute('d',r>.5?'M26 43q6 5 12 0':r>.25?'M26 44h12':'M26 46q6-5 12 0');if(k.pat<=0)gone=true});
    if(gone){S.cust=S.cust.filter(k=>{if(k.pat>0)return true;S.lost++;S.streak=0;toast('客人等太久走掉了','#ff8a7a');return false});renderCust()}
    if(S.t>=S.next&&S.cust.length<3){spawn();S.next=S.t+rnd(4,7.5)*Math.max(.5,1-S.t/220-(DAY-1)*.07)}
    hud();if(S.t>=ROUND())end()}
  G.update(dt,S.run);if(cx){cx.clearRect(0,0,W,H);G.draw(cx,W,H,dt);drawPT(dt)}else G.draw(null,W,H,dt);
}catch(e){console.error(e)}}
function start(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();G.loop&&startLoop()}catch(e){ac=null}
  reset();S.run=true;dayUI();$('#start').hidden=true;$('#end').hidden=true;hud()}
function end(){S.run=false;loopVol(0);let best=0;const key='nm_best_'+G.key;try{best=+localStorage.getItem(key)||0;if(S.money>best)localStorage.setItem(key,S.money)}catch(e){}
  const g=goal(DAY),st=S.money>=g*1.6?3:S.money>=g*1.3?2:S.money>=g?1:0;
  $('#stars').innerHTML='<b>'+'★'.repeat(st)+'</b>'+'☆'.repeat(3-st);
  $('#etitle').textContent=st?`第 ${DAY} 天 過關！`:`第 ${DAY} 天 沒達標`;
  $('#final').textContent='$'+S.money;$('#stats').textContent=`出餐 ${S.served} 份 · 完美 ${S.perfect} 份 · 跑掉 ${S.lost} 位`;
  $('#best').textContent=S.money>best?'刷新最高紀錄！':`最高紀錄 $${best}`;
  $('#again').textContent=st?`開始第 ${DAY+1} 天`:`重新挑戰第 ${DAY} 天`;if(st)DAY++;
  $('#end').hidden=false;beep(660,.3,'triangle')}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{if(!S||!S.run||!G.down)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}G.down(...pos(e))});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{if(S&&G.up)G.up(...pos(e))}));

  g.strokeStyle='rgba(40,10,5,.55)';g.lineWidth=2;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*w*.3-3,-h);g.lineTo(i*w*.3+3,h);g.stroke()}g.fillStyle='rgba(255,255,255,.45)';g.fillRect(-w*.5,-h*.6,w,h*.25);g.restore()});
const E3=createEngine(cv);
if(!E3)$('#stage').insertAdjacentHTML('beforeend','<div class="nogl">這台裝置不支援 3D 畫面</div>');
const C=hex,SPH=E3.mesh(GEO.sphere(1,20,14));
/* capsule along local y; lying along world x after rot z=90deg */
const RS=.17,HL=.36,capPts=[];for(let i=0;i<=8;i++){const a=-Math.PI/2+i/8*Math.PI/2;capPts.push([RS*Math.cos(a),-HL+RS*Math.sin(a)])}for(let i=0;i<=8;i++){const a=i/8*Math.PI/2;capPts.push([RS*Math.cos(a),HL+RS*Math.sin(a)])}
capPts[0][0]=0;capPts[capPts.length-1][0]=0;
const CAP=GEO.lathe(capPts,28),NV=CAP.P.length/3;
/* scene */
E3.env.kd=[.35,1,.8];E3.env.kc=[1.45,1.25,1];E3.env.sky=C(0x8a6a50);E3.env.gnd=C(0x2a1408);E3.env.fog=C(0x120806);E3.env.pl=[0,.35,0];E3.env.pc=[1.6,.55,.12];E3.env.pr=3.2;
E3.add(E3.mesh(GEO.rbox(16,.4,10,.1,2)),{pos:[0,-.2,0],col:C(0x4e2c16),nz:.25,ns:1.6,sp:.04});
E3.add(E3.Q,{pos:[0,3,-3.4],scl:[10,4.5,1],col:C(0x2c1a10),nz:.3,ns:1.3,sp:0,rim:0});
for(let i=0;i<9;i++)E3.add(SPH,{pos:[-4+i,4.3+Math.sin(i)*.15,-3.2],scl:[.15,.18,.15],col:C(0xff7050),emi:C(0xd0402a),mode:1});
const grill=E3.group({pos:[0,0,-.1]});
E3.add(E3.mesh(GEO.rbox(3.9,.7,2.6,.08,3)),{parent:grill,pos:[0,.35,0],col:C(0x3a3634),sp:.5,sh:40});
E3.add(E3.mesh(GEO.rbox(3.6,.05,2.3,.02,2)),{parent:grill,pos:[0,.72,0],col:C(0x120c0a),sp:0});
const coals=[];for(let i=0;i<34;i++){const c=E3.add(E3.mesh(GEO.rbox(.32,.16,.26,.06,2)),{parent:grill,pos:[rnd(-1.6,1.6),.78,rnd(-1,1)],rot:[0,rnd(0,3),0],col:C(0x2a1a14),emi:[.5,.12,.02],nz:.6,ns:8,sp:0});c.ph=rnd(0,6);coals.push(c)}
const BAR=E3.mesh(GEO.lathe([[0,0],[.02,0],[.02,1],[0,1]],8));
for(let i=0;i<14;i++)E3.add(BAR,{parent:grill,pos:[-1.85,1.0,-1.1+i*.17],rot:[0,0,-Math.PI/2],scl:[1,3.7,1],col:C(0x6a6662),sp:.9,sh:50});
[-1.95,1.95].forEach(x=>E3.add(E3.mesh(GEO.rbox(.1,.36,2.6,.03,2)),{parent:grill,pos:[x,.88,0],col:C(0x4a4644),sp:.6}));
E3.blob(grill,2.8,.005,.55);
/* plate with garlic */
const PLATE=[2.35,.02,1.45];
const plate=E3.add(E3.mesh(GEO.lathe([[0,0],[.62,0],[.72,.04],[.8,.09],[.82,.08],[.78,.03],[.66,-.01],[0,-.01]],40)),{pos:PLATE.slice(),col:C(0xf8f6f1),sp:.7,sh:60});
E3.blob(plate,1,-.017,.4);
const garlic=E3.group({pos:[PLATE[0]+.3,.08,PLATE[2]+.35],vis:false});
for(let i=0;i<5;i++)E3.add(SPH,{parent:garlic,pos:[Math.cos(i*1.3)*.13,.04,Math.sin(i*1.3)*.1],rot:[0,i,.3],scl:[.09,.06,.06],col:C(0xf3ead6),sp:.6,sh:40});
const tray=E3.add(E3.mesh(GEO.rbox(1.3,.06,.8,.03,2)),{pos:[-2.5,.03,1.5],col:C(0xb9bcbe),sp:1,sh:60});
for(let i=0;i<3;i++){const n=E3.add(E3.mesh(CAP),{pos:[-2.5,.21,1.25+i*.25],rot:[0,0,Math.PI/2],col:colAt(0),nz:.15,ns:10,sp:.5,sh:40})}
const tags=makeTags($('#tags'));
const G2={ss:[],plateN:[],flv:0,garlic:false,el:0,uid:0,bag:[]};
function frame(W,H){const tgt=[0,.55,.55],dir=norm([0,1.25,1]),vf=E3.cam.fov*Math.PI/360,hf=Math.atan(Math.tan(vf)*W/H),d=Math.max(3.25/Math.tan(hf),2.35/Math.tan(vf));
  E3.cam.tgt=tgt;E3.cam.pos=[tgt[0]+dir[0]*d,tgt[1]+dir[1]*d,tgt[2]+dir[2]*d]}
const GY=1.2;
function paint(b){const c=b.geo.C,P=CAP.P,N=CAP.N,ca=colAt(b.pa),cb=colAt(b.pb),ka=Math.min(1.2,b.pa/1.1),kb=Math.min(1.2,b.pb/1.1);
  for(let i=0;i<NV;i++){const nx=N[i*3],w=clamp((nx+1)/2*1.6-.3,0,1),y=P[i*3+1],stripe=Math.sin(y*26)>.55?1:0,k=ka*w+kb*(1-w),m=1-.32*k*stripe;
    for(let j=0;j<3;j++)c[i*3+j]=(ca[j]*w+cb[j]*(1-w))*m}E3.setColors(b.m,c)}
function addSausage(){const i=SLOTS.findIndex((_,k)=>!G2.ss.some(b=>b.slot===k));if(i<0){toast('烤架滿了！','#ffd56a');return}
  const geo={P:CAP.P,N:CAP.N,I:CAP.I,C:new Float32Array(NV*3)},m=E3.mesh(geo);
  const b={id:++G2.uid,slot:i,pa:0,pb:0,ang:0,tgt:0,in:0,geo,m,lp:-1};b.n=E3.add(m,{col:[1,1,1],nz:.12,ns:12,sp:.35,sh:40,rim:.2});paint(b);G2.ss.push(b);beep(500,.06)}
const up=b=>Math.round(b.tgt/Math.PI)%2===0;/* true: side A up, so side B cooks */
function pickS(x,y){let best=null,bd=1e9;G2.ss.forEach(b=>{if(b.in<1)return;const [sx,sz]=SLOTS[b.slot],c=E3.project([sx,GY,sz]),q=E3.project([sx+.55,GY,sz]),r=Math.max(24,Math.abs(q[0]-c[0])),d=Math.hypot(x-c[0],y-c[1]);if(d<r&&d<bd){bd=d;best=b}});return best}
function take(b){const sa=stageOf(b.pa),sb=stageOf(b.pb);
  if(sa==='char'||sb==='char'){E3.remove(b.n);G2.ss=G2.ss.filter(q=>q!==b);toast('烤焦了，丟掉','#bbb');return}
  if(G2.bag.length>=4){toast('盤子滿了！','#ffd56a');return}
  const q=sa==='good'&&sb==='good'?'good':(sa==='raw'||sb==='raw')?'raw':'over';G2.ss=G2.ss.filter(x=>x!==b);
  const k=G2.bag.length;b.n.pos=[PLATE[0]-.15+(k%2)*.1,.13+k*.07,PLATE[2]-.35+k*.22];b.n.rot=[0,.25,Math.PI/2];G2.bag.push(q);G2.plateN.push(b.n);
  for(let i=0;i<4;i++)E3.puff([PLATE[0],.3,PLATE[2]],{vy:.6,r:.08,grow:.3,a:.15,life:1,max:1});
  beep(q==='good'?880:360,.1,'triangle');toast(q==='good'?'油亮焦香！':q==='raw'?'還沒烤熟':'有點焦',q==='good'?'#ffd56a':'#f3d2a0');if(q==='good')buzz(12);updSum()}
function tap(x,y){const b=pickS(x,y);if(!b)return;if(b.pa>=.8&&b.pb>=.8)return take(b);b.tgt+=Math.PI;noise(.25,.1,3500);for(let i=0;i<5;i++){const [sx,sz]=SLOTS[b.slot];E3.puff([sx+rnd(-.4,.4),GY,sz],{vx:rnd(-.3,.3),vy:rnd(1,2),g:2,r:.025,grow:0,a:.95,col:[1,.6,.2],life:.6,max:.6})}}
boot({key:'sausage',gl:true,round:90,patience:40,loop:true,goal:d=>240+d*130,
  layout:frame,
  reset(){G2.ss.slice().forEach(b=>E3.remove(b.n));G2.ss=[];G2.plateN.forEach(n=>E3.remove(n));G2.plateN=[];G2.bag=[];G2.flv=0;G2.garlic=false;setT();E3.clearParts()},
  demo(){for(let i=0;i<4;i++)addSausage();G2.ss.forEach((b,i)=>{b.in=1;b.pb=.3+i*.25;b.pa=i*.2;if(i%2){b.tgt=b.ang=Math.PI}paint(b)})},
  order(day){return{n:1+Math.floor(Math.random()*(day<2?3:4)),flv:Math.floor(Math.random()*3),garlic:Math.random()<.6}},
  orderText:o=>`客人要 ${o.n} 根，${FLV[o.flv]}，${o.garlic?'要蒜頭':'不要蒜頭'}`,
  orderHTML:o=>`<img src="${sIcon()}" alt=""><b>${o.n}</b> 根<br>${FLV[o.flv]}${o.garlic?'·蒜':''}`,
  matches:o=>G2.bag.length===o.n&&G2.flv===o.flv&&G2.garlic===o.garlic,
  check(o){if(!G2.bag.length)return{err:'盤子是空的'};if(G2.bag.length!==o.n)return{err:`我要 ${o.n} 根啦！`};
    let pay=0,perfect=true,msg='';G2.bag.forEach(q=>{if(q==='good')pay+=15;else{perfect=false;pay+=q==='over'?9:4;msg=q==='over'?'有點焦':'裡面還是生的'}});
    if(G2.flv!==o.flv||G2.garlic!==o.garlic){pay=Math.round(pay*.5);perfect=false;msg=G2.flv!==o.flv?`我要${FLV[o.flv]}的`:(o.garlic?'蒜頭呢？':'我不要蒜頭')}
    return perfect?{pay:pay+6,perfect:true}:{pay,msg}},
  clear(){G2.plateN.forEach(n=>E3.remove(n));G2.plateN=[];G2.bag=[];G2.flv=0;G2.garlic=false;setT()},
  sum:()=>G2.bag.length?`<span class="bag">${G2.bag.map(()=>`<img src="${sIcon()}" alt="">`).join('')}</span><span style="font-weight:500;font-size:14px">${FLV[G2.flv]}${G2.garlic?' · 蒜頭':''}</span>`:'盤子是空的',
  update(dt,run){G2.ss.forEach(b=>{b.in=Math.min(1,b.in+dt*3);if(b.in<1)return;const r=run?dt/COOK:0;if(up(b)){b.pb+=r;b.pa+=r*.08}else{b.pa+=r;b.pb+=r*.08}
      b.ang+=(b.tgt-b.ang)*Math.min(1,dt*12);const sm=b.pa+b.pb;if(Math.abs(sm-b.lp)>.012){b.lp=sm;paint(b)}});
    loopVol(run?Math.min(.1,.016*G2.ss.length):0)},
  draw(_,W,H,dt){if(!E3)return;G2.el+=dt;const el=G2.el;let ti=0;
    coals.forEach(c=>{const f=.5+.25*Math.sin(el*3+c.ph)+.1*Math.sin(el*7.3+c.ph*2);c.emi=[.55*f+.15,.13*f,.02]});
    E3.env.pc=[1.5+.2*Math.sin(el*5),.55,.12];
    G2.ss.forEach(b=>{const [sx,sz]=SLOTS[b.slot],k=b.in;b.n.pos=[sx,GY+(1-k)*1.2,sz];b.n.rot=[b.ang,0,Math.PI/2];
      const ok=b.pa>=.8&&b.pb>=.8,burnt=b.pa>=1.4||b.pb>=1.4;b.n.sp=.3+.5*Math.min(1,(b.pa+b.pb)/2);b.n.emi=ok&&!burnt?[.2+.1*Math.sin(el*8+b.id),.08,0]:[0,0,0];
      if(Math.random()<dt*(burnt?5:1.6))E3.puff([sx+rnd(-.4,.4),GY+.15,sz],{vy:.7,r:.08,grow:.4,a:burnt?.35:.15,col:burnt?[.3,.3,.3]:[.9,.9,.9],life:1.4,max:1.4});
      const s=E3.project([sx,GY,sz+.3]),t=tags.get(ti++);t.style.display='block';t.style.transform=`translate(${s[0]-26}px,${s[1]}px)`;
      if(t.dataset.k!=='s'){t.dataset.k='s';t.innerHTML='<div class="two"><div class="mt"><i></i></div><div class="mt"><i></i></div></div>'}
      const ms=t.querySelectorAll('.mt i');ms[0].style.setProperty('--p',Math.min(100,b.pa/1.5*100)+'%');ms[1].style.setProperty('--p',Math.min(100,b.pb/1.5*100)+'%');t.firstChild.classList.toggle('ok',ok)});
    tags.hideFrom(ti);
    if(Math.random()<dt*3)E3.puff([rnd(-1.5,1.5),1.0,rnd(-1,1)],{vx:rnd(-.2,.2),vy:rnd(.8,1.6),r:.02,grow:0,a:.9,col:[1,.55,.15],life:.8,max:.8});
    garlic.vis=G2.garlic&&G2.bag.length>0;
    E3.stepParts(dt);E3.render(W,H);$('#hint3').hidden=!(S&&S.run&&!G2.ss.length&&!G2.bag.length)},
  down(x,y){tap(x,y)}
});
function setT(){const f=$('#flv'),g=$('#garlic');if(!f)return;f.textContent='口味：'+FLV[G2.flv];f.classList.toggle('hot',G2.flv>0);g.textContent='蒜頭：'+(G2.garlic?'加':'不加');g.classList.toggle('on',G2.garlic);updSum()}
$('#addss').onclick=()=>{if(S.run)addSausage()};
$('#flv').onclick=()=>{G2.flv=(G2.flv+1)%3;setT();beep(500+G2.flv*150,.05)};
$('#garlic').onclick=()=>{G2.garlic=!G2.garlic;setT();beep(600,.05)};
$('#dumpss').onclick=()=>{if(!G2.bag.length)return;G2.plateN.forEach(n=>E3.remove(n));G2.plateN=[];G2.bag=[];updSum();beep(200,.15,'square',.05)};

}
</script>
